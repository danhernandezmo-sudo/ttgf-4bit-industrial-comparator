# Tiny Tapeout project information
project:
  title: "4-bit Industrial Comparator"
  author: "Daniel Hernández Morán"
  discord: ""
  description: "4-bit digital comparator for industrial product sorting."
  language: "Verilog"
  clock_hz: 0

  tiles: "1x1"

  top_module: "tt_um_industrial_comparator"

  source_files:
    - "project.v"
    - "comparador_2bits.v"
    - "comparador_4bits.v"

pinout:
