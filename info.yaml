  ui[3]: "A3"
  ui[4]: "B0"
  ui[5]: "B1"
  ui[6]: "B2"
  ui[7]: "B3"

  # Outputs
  uo[0]: "GT"
  uo[1]: "EQ"
  uo[2]: "LT"
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
